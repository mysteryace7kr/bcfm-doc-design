<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="대외 기안문" description="수신·경유·제목 체계와 결재란을 갖춘 대외 발송용 기안·신청 문서 뼈대" -->
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 조판 변수 등록 — 속성 패널 바인딩(bodyFs·bodyLh)이 해결되지 않아
     `--body-fs: px` 같은 무효값이 들어와도 var() 폴백은 발동하지 않고
     상속값(16px/normal)으로 튄다. @property의 initial-value가 그때
     본래 기본값으로 되돌려 준다. */
  @property --body-fs { syntax:'<length>'; inherits:true; initial-value:13.5px; }
  @property --body-lh { syntax:'<number>'; inherits:true; initial-value:1.75; }
  :root{
    --ink:#1c1d20; --ink-strong:#141619; --ink-mid:#2a2b2e; --ink-soft:#63656a;
    --muted:#8b8880;
    --band:#f6f4ef;
    --rule:#dcd7cd; --rule-soft:#e2ddd3; --rule-strong:#cec9be; --rule-hair:#ddd8ce;
    --link:#2c4a6e; --link-hover:#16324f;
    --sans:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  }
  html{ font-family:var(--sans); }
  body{ margin:0; }
  doc-page:not(:defined){ visibility:hidden; }
  doc-page{ font-family:var(--sans); font-size:var(--body-fs,13.5px); line-height:var(--body-lh,1.75);
            color:var(--ink); letter-spacing:-0.015em; }
  a{ color:var(--link); } a:hover{ color:var(--link-hover); }

  /* ── 지면 — 흐름 문서. 쪽은 브라우저 인쇄 엔진이 나눈다 ───────────
     원고를 그냥 부으면 된다. 쪽을 손으로 나누지 않는다.
     여백은 doc-page 의 margin 속성이 소유한다. */
  /* BCFM의 출력 계약은 A4. 여백은 런타임 한 곳에서만 관리한다. */
  @page{ size:A4; }
  doc-page{ word-break:keep-all; line-break:strict; overflow-wrap:anywhere; }
  /* 제목·표제 장식은 뒤 내용과 유지. 본문·긴 표·긴 인용은 흐르게 한다. */
  h1,h2,h3,h4,.kicker,.rule86{ break-after:avoid-page; }
  doc-page p,doc-page li,.quote{ orphans:2; widows:2; text-wrap:pretty; }
  .band,.card,.keep-together,.signature,.approval{ break-inside:avoid-page; }
  .quote,.allow-split{ break-inside:auto; }
  /* 서로 다른 한 줄 문단에는 widows/orphans가 작동하지 않는다. */
  .quote > p:first-child{ break-after:avoid-page; }
  .quote > p:last-child{ break-before:avoid-page; }
  tr,img{ break-inside:avoid-page; }
  thead{ display:table-header-group; }
  /* 의미상 떼면 안 되는 짧은 단위만 사용. 긴 문장에는 사용하지 않는다. */
  .keep-phrase{ white-space:nowrap; }
  img,svg{ max-width:100%; }

  /* ── 표제 위계 (§8.3) ───────────────────────────── */
  .kicker{ font-size:10.5px; font-weight:500; letter-spacing:0.34em; color:var(--muted); text-align:center; }
  h1{ margin:13px 0 0; font-size:25px; font-weight:700; letter-spacing:-0.03em;
      line-height:1.34; text-align:center; color:var(--ink-strong); text-wrap:balance; }
  .rule86{ margin:15px auto 0; width:86px; border-top:2px solid var(--ink-strong); }
  h2{ margin:26px 0 11px; padding-bottom:6px; border-bottom:1px solid var(--rule-strong);
      font-size:17px; font-weight:700; letter-spacing:-0.02em; color:var(--ink-strong); }
  h3{ margin:20px 0 8px; font-size:15px; font-weight:700; letter-spacing:-0.02em; color:var(--ink-strong); }

  /* ── 개조식 기호 위계 (○ ▶ ※ ⇨ / 가.나.다.) ───── */
  .o,.t,.n,.r,.k{ margin:0 0 .34em; word-break:keep-all; text-align:justify; orphans:2; widows:2; }
  .o{ padding-left:1.15em; text-indent:-1.15em; color:var(--ink); }
  .k{ padding-left:2.45em; text-indent:-1.25em; color:var(--ink); }
  .t{ padding-left:2.45em; text-indent:-1.25em; color:var(--ink-mid); font-size:calc(var(--body-fs,13.5px)*.94); }
  .n{ padding-left:2.45em; text-indent:-1.25em; color:var(--muted); font-size:calc(var(--body-fs,13.5px)*.88); }
  .r{ margin-top:.5em; padding-left:1.3em; text-indent:-1.3em;
      color:var(--ink-strong); font-weight:700; }
  .lead{ margin:0 0 .7em; text-align:justify; word-break:keep-all; orphans:2; widows:2; }

  /* ── 블록 ────────────────────────────────────────── */
  .band{ margin:19px 0 4px; padding:11px 15px 12px; background:var(--band);
         border-top:1px solid var(--rule-soft); border-bottom:1px solid var(--rule-soft); }
  .quote{ margin:.7em 0 1em; padding:11px 15px; background:var(--band);
          border-top:1px solid var(--rule-soft); border-bottom:1px solid var(--rule-soft);
          font-size:calc(var(--body-fs,13.5px)*.92); line-height:1.8; word-break:keep-all;
          text-align:justify; color:var(--ink-mid); }
  table{ width:100%; border-collapse:collapse; font-size:calc(var(--body-fs,13.5px)*.92);
         line-height:1.7; color:var(--ink); margin:6px 0 4px; }
  th,td{ padding:7px 10px; border:0.8px solid var(--rule); vertical-align:top; word-break:keep-all; }
  th{ background:var(--band); font-size:calc(var(--body-fs,13.5px)*.85); font-weight:700;
      text-align:left; color:var(--ink-mid); }
  td.num{ text-align:right; }
  thead th{ text-align:center; }

  /* ── 푸터 — slot="footer"로 매 쪽 반복 (§8.3) ────── */
  .foot{ display:flex; justify-content:space-between; align-items:baseline; padding-top:6px;
         border-top:0.6px solid var(--rule-hair); font-size:9.5px; letter-spacing:0.02em;
         color:var(--muted); }
  strong{ font-weight:700; color:var(--ink-strong); }
</style>
<script src="./doc-page.js"></script>
</helmet>

<doc-page size="a4" margin="20mm" style="--body-fs: {{ bodyFs }}px; --body-lh: {{ bodyLh }}">
  <div class="kicker">[수신기관] 귀중</div>
  <h1>[제목]</h1>
  <div class="rule86"></div>

  <h2>수신 및 제목</h2>
  <table>
    <tbody>
      <tr><th style="width:22%">수신</th><td>[수신기관 및 부서]</td></tr>
      <tr><th>참조</th><td>[참조 부서]</td></tr>
      <tr><th>제목</th><td>[제목]</td></tr>
    </tbody>
  </table>

  <h2>본문</h2>
  <p class="lead">1. 귀 [기관]의 무궁한 발전을 기원합니다.</p>
  <p class="lead">2. [근거 조항 — 원문서에 적힌 조문을 그대로 인용한다]에 따라 아래와 같이 [신청·요청]합니다.</p>
  <p class="k">가. [항목] : [내용]</p>
  <p class="k">나. [항목] : [내용]</p>
  <p class="k">다. [항목] : [내용]</p>
  <p class="lead">3. [마무리 문장]  &nbsp;&nbsp;<strong>끝.</strong></p>

  <h2>결재</h2>
  <table class="approval">
    <thead><tr><th style="width:25%">담당</th><th style="width:25%">팀장</th><th style="width:25%">상무이사</th><th style="width:25%">대표이사</th></tr></thead>
    <tbody><tr><td style="height:52px"></td><td></td><td></td><td></td></tr></tbody>
  </table>

  <div class="signature" style="margin:30px 0 0;text-align:center">
    <div style="font-size:20px;font-weight:700;letter-spacing:-0.03em;color:var(--ink-strong)">[발신명의]</div>
    <div style="margin-top:6px;font-size:12px;color:var(--muted)">[주소] &nbsp;·&nbsp; 전화 [번호]</div>
    <div style="margin-top:4px;font-size:12px;color:var(--muted)">[문서번호] &nbsp;·&nbsp; [시행일] 시행</div>
  </div>

<div slot="footer" class="foot"><span>[문서명]</span><span>부산공동어시장</span></div>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;bodySize&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 13.5, &quot;min&quot;: 12.0, &quot;max&quot;: 15.0, &quot;step&quot;: 0.5, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;조판&quot;},
  &quot;lineSpacing&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1.75, &quot;min&quot;: 1.6, &quot;max&quot;: 1.9, &quot;step&quot;: 0.05, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;조판&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    return {
      bodyFs: this.props.bodySize ?? 13.5,
      bodyLh: this.props.lineSpacing ?? 1.75,
    };
  }
}
</script>
</body>
</html>
